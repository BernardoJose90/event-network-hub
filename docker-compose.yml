name: portal-pdf-test

services:
  gotenberg:
    build: ./gotenberg
    # No "ports": Gotenberg is reachable only from the backend on the compose network.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # In-browser spreadsheet editor (Collabora Online Development Edition, for
  # testing; production needs a Collabora subscription). The browser loads the
  # editor from it directly, so it is published on localhost:9980. It fetches
  # and saves files only through the backend's WOPI endpoints (aliasgroup1).
  collabora:
    image: collabora/code:26.04.4.2.1
    environment:
      aliasgroup1: ${COLLABORA_WOPI_HOST:-http://backend:8000}
      server_name: ${COLLABORA_SERVER_NAME:-localhost:9980}
      DONT_GEN_SSL_CERT: "1"
      # Local test only: plain HTTP, embeddable by the frontend, no welcome popups.
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=false
        --o:net.frame_ancestors=${COLLABORA_FRAME_ANCESTOR:-localhost:5173}
        --o:home_mode.enable=true
    ports:
      - "127.0.0.1:9980:9980"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      GOTENBERG_TIMEOUT_SECONDS: ${GOTENBERG_TIMEOUT_SECONDS:-90}
      DATA_DIR: ${DATA_DIR:-/data}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COLLABORA_URL: ${COLLABORA_URL:-http://collabora:9980}
      WOPI_BASE_URL: ${WOPI_BASE_URL:-http://backend:8000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      # Leave unset locally (random per start); set from a secret store in production.
      WOPI_TOKEN_SECRET: ${WOPI_TOKEN_SECRET:-}
      # Help desk WhatsApp bot integration (off when empty). Secrets come from .env, never the repo.
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      BOT_CALLBACK_URL: ${BOT_CALLBACK_URL:-}
      BOT_CALLBACK_SECRET: ${BOT_CALLBACK_SECRET:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      # Notifications (each channel off when empty). Secrets come from .env, never the repo.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ict@websummit.com}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Event Network Hub <no-reply@websummit.com>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ESCALATION_EMAILS: ${ESCALATION_EMAILS:-}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # Unit tests: docker compose run --rm tests
  tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]

volumes:
  appdata:
