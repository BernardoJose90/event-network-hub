name: portal-pdf-test

services:
  gotenberg:
    build: ./gotenberg
    # No "ports": Gotenberg is reachable only from the backend on the compose network.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      GOTENBERG_TIMEOUT_SECONDS: ${GOTENBERG_TIMEOUT_SECONDS:-90}
      DATA_DIR: ${DATA_DIR:-/data}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Help desk WhatsApp bot integration (off when empty). Secrets come from .env, never the repo.
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      BOT_CALLBACK_URL: ${BOT_CALLBACK_URL:-}
      BOT_CALLBACK_SECRET: ${BOT_CALLBACK_SECRET:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      # Paused areas: set to true to switch the help desk or reports back on (data is kept).
      FEATURE_HELPDESK: ${FEATURE_HELPDESK:-false}
      FEATURE_REPORTS: ${FEATURE_REPORTS:-false}
      # The Web Summit look (colours, logo, gradient). false = a plain, neutral look.
      FEATURE_WEBSUMMIT_THEME: ${FEATURE_WEBSUMMIT_THEME:-false}
      # Notifications (each channel off when empty). Secrets come from .env, never the repo.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ict@websummit.com}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Event Network Hub <no-reply@websummit.com>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ESCALATION_EMAILS: ${ESCALATION_EMAILS:-}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
      # Public test address (prototype): host names allowed besides localhost, comma-separated.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-.trycloudflare.com}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # Unit tests: docker compose run --rm tests
  tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]

volumes:
  appdata:
