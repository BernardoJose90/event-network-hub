name: portal-pdf-test

services:
  gotenberg:
    build: ./gotenberg
    # No "ports": Gotenberg is reachable only from the backend on the compose network.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      GOTENBERG_TIMEOUT_SECONDS: ${GOTENBERG_TIMEOUT_SECONDS:-90}
      DATA_DIR: ${DATA_DIR:-/data}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      gotenberg:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # Unit tests: docker compose run --rm tests
  tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]

volumes:
  appdata:
