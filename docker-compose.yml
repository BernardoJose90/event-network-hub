name: portal-pdf-test

services:
  # PostgreSQL, the same major version as RDS in the cluster (modules/rds: engine_version 17).
  # Local only: the password below is not a secret.
  postgres:
    image: postgres:17.12-trixie
    environment:
      POSTGRES_DB: event_network_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres17:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"  # for pytest from the host; change it if 5432 is taken
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "event_network_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gotenberg:
    build: ./gotenberg
    # No "ports": Gotenberg is reachable only from the backend on the compose network.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      GOTENBERG_TIMEOUT_SECONDS: ${GOTENBERG_TIMEOUT_SECONDS:-90}
      DATA_DIR: ${DATA_DIR:-/data}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/event_network_hub}
      # Files go to the appdata volume unless a bucket is set (S3 in the cluster).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Help desk WhatsApp bot integration (off when empty). Secrets come from .env, never the repo.
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      BOT_CALLBACK_URL: ${BOT_CALLBACK_URL:-}
      BOT_CALLBACK_SECRET: ${BOT_CALLBACK_SECRET:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      # Feature switches (on by default). false pauses the help desk or reports (data is kept),
      # or swaps the Web Summit look for a plain, neutral one.
      FEATURE_HELPDESK: ${FEATURE_HELPDESK:-true}
      FEATURE_REPORTS: ${FEATURE_REPORTS:-true}
      FEATURE_WEBSUMMIT_THEME: ${FEATURE_WEBSUMMIT_THEME:-true}
      # Notifications (each channel off when empty). Secrets come from .env, never the repo.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ict@websummit.com}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Event Network Hub <no-reply@websummit.com>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ESCALATION_EMAILS: ${ESCALATION_EMAILS:-}
    volumes:
      # Not "appdata": that volume holds the SQLite-era database and files, kept untouched.
      - appdata-postgres:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      gotenberg:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
      # Public test address (prototype): host names allowed besides localhost, comma-separated.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-.trycloudflare.com}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # Unit tests: docker compose run --rm tests
  tests:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_network_hub
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

volumes:
  appdata-postgres:
  postgres17:
